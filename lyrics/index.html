<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LYRICS</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#000;color:#fff;padding:20px}a{color:#fff}.song{border:1px solid #222;border-radius:16px;padding:20px;background:#0a0a0a}</style>
</head><body>
<header><a href="../" style="text-decoration:none;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px">← BACK</a><h1 style="margin-top:16px;letter-spacing:3px">LYRICS</h1></header>
<div id="list" style="margin-top:20px"></div>
<script>
fetch('data.json').then(r=>r.json()).then(songs=>{
 document.getElementById('list').innerHTML=songs.map(s=>`<div class="song"><h2>${s.title}</h2><p style="margin-top:12px;color:#888;white-space:pre-wrap">${s.lyrics}</p><a href="${s.youtube}" target="_blank" style="display:inline-block;margin-top:12px">▶ Watch video</a></div>`).join('');
});
</script>
</body></html>
