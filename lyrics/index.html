<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LYRICS - RYBAHYBRYD</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#05050A;color:#fff;padding:20px;max-width:720px;margin:0 auto}a{color:#fff} .song{background:#0F0F14;border:1px solid #1E1E26;border-radius:18px;padding:20px;margin-bottom:16px}</style>
</head><body>
<header><a href="../" style="text-decoration:none;border:1px solid #333;padding:8px 14px;border-radius:20px;font-size:12px">&larr; BACK</a><h1 style="margin-top:16px;letter-spacing:3px">LYRICS</h1></header>
<div id="list" style="margin-top:20px">Loading...</div>
<script>
fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(songs=>{
 document.getElementById('list').innerHTML=songs.map(s=>`<div class="song"><h2>${s.title}</h2><p style="margin-top:12px;color:#888;white-space:pre-wrap;line-height:1.6">${s.lyrics}</p>${s.youtube?`<a href="${s.youtube}" target="_blank" style="display:inline-block;margin-top:12px;border:1px solid #fff;padding:8px 14px;border-radius:20px;font-size:11px">Watch video</a>`:''}</div>`).join('');
});
</script>
</body></html>
