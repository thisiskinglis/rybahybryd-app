<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYBAHYBRYD - APP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{padding:24px;text-align:center;border-bottom:1px solid #222}
header h1{letter-spacing:6px;font-size:18px;font-weight:900}
.grid{flex:1;display:grid;grid-template-columns:1fr;gap:16px;padding:20px;max-width:600px;margin:0 auto;width:100%}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.card{border:1px solid #333;border-radius:24px;padding:28px;background:#0a0a0a;transition:.2s;text-decoration:none;color:#fff;display:flex;flex-direction:column;gap:12px}
.card:hover{border-color:#fff;transform:translateY(-2px)}
.card h2{font-size:28px;letter-spacing:2px}
.card p{color:#888;font-size:14px;line-height:1.4}
.tag{display:inline-block;font-size:10px;letter-spacing:2px;border:1px solid #333;padding:4px 8px;border-radius:20px;width:fit-content}
.feed{grid-column:span 2}
</style>
</head>
<body>
<header><h1>RYBAHYBRYD</h1></header>
<div class="grid">
  <a href="feed/" class="card feed">
    <span class="tag">LIVE NOW</span>
    <h2>FEED</h2>
    <p>Behind the scenes, voice notes, short clips. Raw, unfiltered.</p>
  </a>
  <a href="lyrics/" class="card">
    <span class="tag">MUSIC</span>
    <h2>LYRICS</h2>
    <p>Videos + lyrics. Read what he really meant.</p>
  </a>
  <a href="beats/" class="card">
    <span class="tag">COMING SOON</span>
    <h2>BEATS</h2>
    <p>Exclusive beats for sale. Preview + instant delivery.</p>
  </a>
</div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
