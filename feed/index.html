<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FEED - RYBAHYBRYD</title>
<link rel="manifest" href="../manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#05050A;color:#fff;padding:20px;max-width:520px;margin:0 auto;min-height:100vh}
a{color:#fff;text-decoration:none}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
header a{border:1px solid #222;padding:8px 14px;border-radius:20px;font-size:11px;letter-spacing:1px}
.post{background:#0F0F14;border:1px solid #1E1E26;border-radius:18px;padding:16px;margin-bottom:16px}
.post small{color:#555;font-size:10px;letter-spacing:1px}
.post p{margin:10px 0 0;font-size:14px;line-height:1.4}
.post img,.post video{width:100%;border-radius:12px;margin-top:12px;display:block;background:#000}
.post audio{width:100%;margin-top:12px}
.badge{display:inline-block;background:#111;border:1px solid #222;padding:2px 8px;border-radius:10px;font-size:9px;margin-right:6px}
</style>
</head><body>
<header><a href="../">← BACK</a><div style="font-weight:800;letter-spacing:2px;font-size:12px">FEED</div><div style="width:60px"></div></header>
<div id="feed">Loading...</div>
<script>
async function load(){
  try{
    const res = await fetch('data.json?v='+Date.now(), {cache:'no-store'});
    const posts = await res.json();
    document.getElementById('feed').innerHTML = posts.map(p=>{
      let media = '';
      if(p.type==='image') media = `<img src="${p.file}?v=${Date.now()}" onerror="this.style.display='none'" alt="">`;
      if(p.type==='voice') media = `<audio controls preload="none" src="${p.file}"></audio>`;
      if(p.type==='video') media = `<video controls playsinline preload="none" src="${p.file}"></video>`;
      return `<div class="post"><div><span class="badge">${p.type.toUpperCase()}</span><small>${p.date}</small></div><p>${p.caption}</p>${media}</div>`;
    }).join('');
  }catch(e){
    document.getElementById('feed').innerHTML = '<p style="color:#f55">Could not load data.json - '+e+'</p>';
  }
}
load();
</script>
</body></html>
